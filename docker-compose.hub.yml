# 直接拉取 Docker Hub 镜像的部署方式（无需本地构建）
# 使用 host 网络：容器直接用宿主机端口，避免大范围端口映射（如 20000-29999）
# 导致 Docker 生成上万条 iptables 规则而卡死
# 用法: docker compose -f docker-compose.hub.yml up -d
services:
  panel:
    image: amw1933/tpanel:latest
    container_name: tpanel
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data
    environment:
      - PANEL_PORT=8080
      - AGENT_PORT=9000
      - VHOST_PORT=8090
      - PANEL_USER=admin
      - PANEL_PASSWORD=admin123
