name: Build and Push to Docker Hub

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["*.md", "docs/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check DOCKERHUB_USERNAME
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "::error::DOCKERHUB_USERNAME secret 未配置"
            exit 1
          fi

      - name: Check DOCKERHUB_TOKEN
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_TOKEN secret 未配置"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tpanel:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tpanel:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}/tpanel:{1}', secrets.DOCKERHUB_USERNAME, github.ref_name) || '' }}
